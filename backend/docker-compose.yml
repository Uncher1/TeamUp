services:
  mariadb:
    image: mariadb:11
    container_name: teamup-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: teamup
      MARIADB_USER: teamup
      MARIADB_PASSWORD: teamup
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mariadb_data:
