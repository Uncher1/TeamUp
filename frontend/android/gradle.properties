org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This machine is memory-constrained (Gradle's default -Xmx8G OOM-crashed the
# daemon). Keep the build lean: smaller heap, no lingering daemon, few workers.
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
